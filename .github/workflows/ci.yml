name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Core build & test ──────────────────────────────────────────────────────
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --locked

      - name: Dependency vulnerability audit (§20.1.2)
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: build release binary
        run: cargo build --release --bin rust-can --locked

      - name: smoke test CLI
        run: |
          ./target/release/rust-can version --format json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['tool'] == 'rust-can', f'bad tool: {d}'
          assert d['protocol'] == 'CAN', f'bad protocol: {d}'
          assert d['spec_version'] == '1.10', f'bad spec_version: {d}'
          print('version JSON OK')
          "
          ./target/release/rust-can capabilities | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['kind'] == 'capabilities', f'bad kind: {d}'
          assert d['adapt'] == True, f'adapt must be true: {d}'
          print('capabilities JSON OK')
          "
          ./target/release/rust-can status --format json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['protocol'] == 'CAN', f'bad protocol: {d}'
          print('status JSON OK')
          "
          echo '{"id":291,"fd":true,"brs":true,"data":"3q2+7w=="}' \
            | ./target/release/rust-can convert --protocol CAN | python3 -c "
          import json, sys, base64
          d = json.load(sys.stdin)
          assert d['id'] == '291', f'bad id: {d}'
          assert d['protocol'] == 1, f'bad protocol: {d}'
          assert base64.b64decode(d['payload']) == bytes([0xDE,0xAD,0xBE,0xEF]), f'bad payload: {d}'
          print('convert JSON OK')
          "
          convert_ec=0
          echo '{}' | ./target/release/rust-can convert --protocol CAN || convert_ec=$?
          test "$convert_ec" -eq 1 && echo 'convert exit-1 on bad input OK' || \
            { echo "FAIL: expected exit 1 on bad input, got $convert_ec"; exit 1; }
          lin_ec=0
          ./target/release/rust-can convert --protocol LIN </dev/null || lin_ec=$?
          test "$lin_ec" -eq 2 && echo 'convert exit-2 on bad protocol OK' || \
            { echo "FAIL: expected exit 2 on bad protocol, got $lin_ec"; exit 1; }
          # No --iface: send --format json MUST work with no protocol flags
          # at all (§11.2's streaming-JSON-sink contract), defaulting to the
          # virtual bus.
          printf '{"protocol":1,"version":{"major":0,"minor":0,"patch":0},"id":"291","payload":"3q2+7w==","timestamp":"1970-01-01T00:00:00Z","meta":{"can.fd":"true","can.brs":"true","can.ext":"false","can.rtr":"false","can.xl":"false"}}\n' \
            | ./target/release/rust-can send --format json
          echo 'send --format json OK'

  # ── ASIL-B safety checks via rust-FuSa ────────────────────────────────────
  safety:
    name: ASIL-B safety (rust-FuSa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-safety-${{ hashFiles('**/Cargo.lock') }}

      - name: Install rsfusa
        run: cargo install --git https://github.com/SoundMatt/rust-FuSa --tag v0.3.14 rsfusa --locked

      - name: Build release binary (needed for qualify)
        run: cargo build --release --locked

      - name: Run cargo tests (unit + integration)
        run: cargo test --locked

      - name: Capture test evidence with rsfusa
        # Deliberately not gating: rsfusa v0.3.14's `verify` shells out to
        # `cargo test -- --test-output=immediate`, and `--test-output` is not
        # a real cargo/libtest flag (it's a cargo-nextest option) — every
        # test binary rejects it, `cargo test` exits 101, and rsfusa reports
        # a nonsensical "0 failed, 0 passed" despite the real, passing
        # `cargo test` run in the step just above. This is an upstream
        # rust-FuSa bug this repo cannot fix from its own config (filed:
        # SoundMatt/rust-FuSa#46) — gating on it would make this job
        # permanently red for a reason outside this repo's control, so it
        # stays advisory. The mismatch is now surfaced loudly instead of
        # silently discarded: if rsfusa ever reports 0 tests despite the
        # real suite passing, that's this exact upstream bug, not a real
        # regression here.
        run: |
          rsfusa verify --dir . || true
          if [ -f .fusa-evidence.json ]; then
            passed=$(python3 -c "import json; print(json.load(open('.fusa-evidence.json'))['summary']['passed'])")
            if [ "$passed" = "0" ]; then
              echo "::warning::rsfusa verify reported 0 tests passed despite the real 'cargo test' run above passing — this is the known upstream rust-FuSa bug SoundMatt/rust-FuSa#46 (invalid --test-output=immediate flag), not a regression in this repo. .fusa-evidence.json is not trustworthy until that's fixed upstream."
            fi
          fi

      - name: Coding standard lint (ISO 26262 Part 6)
        run: rsfusa lint --dir . --format json --output lint-report.json

      - name: Static analysis
        run: rsfusa analyze --dir . --format json --output analyze-report.json

      - name: Safety check (§20.1.2 — gates on ERROR findings)
        # Gating: §20.1 item 2 requires the standard check to fail the job
        # on any ERROR-severity finding. Deliberately not --strict: rsfusa's
        # --strict mode also fails on WARNING-severity findings (function
        # length / nesting-depth style lint), which is a larger, separate
        # code-quality remediation than an ERROR-severity safety gate; the
        # spec text §20.1 item 2 asks specifically for "gating on ERROR
        # findings". The --strict report is still produced below (SARIF)
        # for visibility without blocking the build on warnings.
        run: rsfusa check --dir . --format json --output check-report.json

      - name: Safety check SARIF, strict (GitHub code scanning)
        # Deliberately not gating, same rationale as above: --strict also
        # fails on WARNING-severity findings (function length / nesting
        # depth), which is a known, tracked code-quality backlog, not a
        # safety regression. Kept for Code Scanning visibility only.
        run: rsfusa check --dir . --strict --format sarif --output results.sarif || true

      - name: Cyclomatic complexity V(G)
        # Deliberately not gating: this repo currently has several
        # functions over rsfusa's complexity threshold (e.g.
        # validate_frame(), DBC parsing) — a known, tracked code-quality
        # backlog like the WARNING-severity --strict findings above, not a
        # safety regression to gate a build on.
        run: rsfusa comp --dir . --format json --output comp-report.json || true

      - name: Requirement traceability matrix (§20.1.2 — gates on 100% traced + tested)
        # Gating: §20.1 item 2 requires 100% requirement traceability (every
        # requirement traced, and every test-verified requirement actually
        # tested) to fail the job otherwise. `rsfusa trace`'s own exit code
        # doesn't enforce this (it always exits 0), so the coverage numbers
        # are asserted explicitly here against .fusa-reqs.json's
        # verificationMethod: a requirement counts as traced if it has any
        # //fusa:req|impl|test|sec-test tag, and as tested if it has a
        # //fusa:test or //fusa:sec-test tag — only requirements whose
        # verificationMethod is "test" are required to be tested (an
        # "inspection"-verified requirement is traced but not necessarily
        # unit-tested).
        run: |
          rsfusa trace --dir . --format json --output trace.json
          rsfusa trace --dir . --format text
          python3 - <<'PYEOF'
          import json
          import sys

          reqs_doc = json.load(open(".fusa-reqs.json"))
          reqs = reqs_doc["requirements"] if isinstance(reqs_doc, dict) else reqs_doc
          trace = json.load(open("trace.json"))
          tags = trace["tags"]

          all_ids = {r["id"] for r in reqs}
          traced_ids = {t["requirementId"] for t in tags}
          tested_ids = {t["requirementId"] for t in tags if t["kind"] in ("test", "sec-test")}
          test_method_ids = {r["id"] for r in reqs if r.get("verificationMethod") == "test"}

          untraced = sorted(all_ids - traced_ids)
          untested = sorted(test_method_ids - tested_ids)

          ok = True
          if untraced:
              print(f"FAIL: {len(untraced)} untraced requirement(s): {untraced}")
              ok = False
          if untested:
              print(f"FAIL: {len(untested)} test-verified requirement(s) with no test tag: {untested}")
              ok = False

          if not ok:
              sys.exit(1)
          print(
              f"OK: {len(all_ids)}/{len(all_ids)} requirements traced, "
              f"{len(test_method_ids)}/{len(test_method_ids)} test-verified requirements tested"
          )
          PYEOF

      - name: FMEA
        run: rsfusa fmea --dir .

      - name: Threat analysis (TARA)
        # Gating: §20.1 item 2 requires safety-lifecycle findings such as
        # TARA gaps to fail the job.
        run: rsfusa tara --dir .

      - name: Cybersecurity analysis (CWE)
        # Gating: §20.1 item 2 requires the cybersecurity analysis to fail
        # the job on any finding.
        run: rsfusa cyber --dir . --format json --output cyber-report.json

      - name: Boundary diagram
        run: rsfusa boundary --dir .

      - name: HARA
        run: rsfusa hara show --dir .

      - name: Tool qualification
        # Must run before "Safety case assembly": the safety case's
        # required-evidence check treats qualify-report.json as a required
        # input, so producing it after safety-case (as this job used to)
        # made safety-case *always* report qualify-report.json missing
        # regardless of whether tool qualification actually ran.
        run: rsfusa qualify

      - name: Safety case assembly
        run: rsfusa safety-case --dir .

      - name: ISO 26262 Part 6 gap report
        # Deliberately not gating: this is a maturity/gap report (rsfusa's
        # own §9.3 "MAY" command class) against the full ISO 26262 Part 6
        # objective set — several objectives (e.g. restricted language
        # subset, data coupling analysis, documentation archive) are
        # system-level concerns out of scope for a standalone library and
        # are expected to show as gaps, not a regression to gate a build on.
        run: rsfusa iso26262 --dir . --format json --output iso26262-gap-report.json || true

      - name: Release artifacts (SBOM, provenance, manifest)
        run: rsfusa release --dir .

      - name: Audit pack
        run: rsfusa audit-pack --output audit-pack.zip

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: Upload safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-evidence
          path: |
            check-report.json
            lint-report.json
            analyze-report.json
            comp-report.json
            cyber-report.json
            trace.json
            fmea.json
            tara.json
            safety-case.json
            safety-case.md
            iso26262-gap-report.json
            qualify-report.json
            sbom.json
            provenance.json
            artifact-manifest.json
            audit-pack.zip
          if-no-files-found: warn

  # ── RELAY conformance gate ────────────────────────────────────────────────
  conformance:
    name: RELAY conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-conform-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --bin rust-can --locked

      - name: Install relay
        # v2.0.0 (current) is not installable via `go install` — its go.mod
        # module path wasn't bumped to the required `/v2` suffix, so Go's
        # semantic import versioning rejects it (filed: SoundMatt/RELAY#70).
        # v1.14.0 is the newest tag that installs cleanly; it also carries
        # v1.13's fix for the `go:embed` glob bug that made golden error
        # vectors unreachable through `relay interop`/`relay convert`
        # (previously pinned here at v1.10.0, which predates that fix and
        # was blind to the whole reject-path vector category), and has no
        # CAN-relevant changes between it and v2.0.0 (v1.14 and v2.0 are
        # both RCP-only changes; rust-CAN is CAN-only).
        run: go install github.com/SoundMatt/RELAY/cmd/relay@v1.14.0

      - name: RELAY conformance (strict)
        run: relay conform --strict ./target/release/rust-can

      - name: RELAY interop (CAN golden vectors — must be EQUIVALENT or SKIP)
        run: |
          # Capture output without propagating exit code — relay interop exits
          # non-zero when any vector is non-EQUIVALENT, but we gate only on
          # CAN-protocol vectors (rust-CAN is CAN-only; DDS/LIN/MQTT/RCP/
          # SOMEIP vectors correctly exit 2 as unsupported).
          interop_out=$(relay interop ./target/release/rust-can 2>&1) || true
          echo "$interop_out"
          # Match each CAN block's per-participant result lines (2-space
          # indented, e.g. "  rust-can               EQUIVALENT") and fail on
          # anything that isn't EQUIVALENT or SKIP — not an allowlist of
          # failure substrings. relay's own interopVerdict() can return
          # EQUIVALENT, SKIP, ERROR, or MISMATCH; a prior version of this
          # gate only matched "ERROR|FAIL", which meant a genuine
          # non-equivalence (reported as "MISMATCH", not "ERROR" or "FAIL")
          # between rust-can and the reference implementation could never be
          # caught here.
          bad=$(echo "$interop_out" | grep -A2 "(CAN)" | grep -E '^  \S' | grep -vE 'EQUIVALENT|SKIP' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: one or more CAN golden vectors not EQUIVALENT/SKIP:"
            echo "$bad"
            exit 1
          fi

  # ── CAN interop testing (ROADMAP.md "Interop testing") ─────────────────────
  can-interop:
    name: CAN interop (kernel SocketCAN vcan0 + can-utils third-party validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-can-interop-${{ hashFiles('**/Cargo.lock') }}

      # Deliverable 1/2: bring up a real kernel vcan interface. Probe-then-
      # skip-cleanly, not hard-fail: a vcan-capable kernel is not something
      # every runner should be blocked on (mirrors rust-DDS's
      # `cyclone-interop` job's own Docker-image probe in
      # .github/workflows/ci.yml).
      - name: Set up vcan0 (probe-then-skip)
        id: vcan
        run: |
          if sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ip -details link show vcan0
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::vcan kernel module / vcan0 interface could not be set up on this runner — skipping CAN interop tests"
          fi

      # Deliverable 2/2: can-utils (cangen/candump) is the third-party,
      # independent oracle — see tests/can_thirdparty_interop.rs's module
      # doc comment for why CAN doesn't need a third-party network stack
      # the way rust-DDS needed CycloneDDS. Also probe-then-skip-cleanly.
      - name: Install can-utils (probe-then-skip)
        id: canutils
        if: steps.vcan.outputs.available == 'true'
        run: |
          if sudo apt-get update -qq && sudo apt-get install -y can-utils; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::can-utils installation failed — skipping can-utils-based third-party interop tests (two-process self-interop above is unaffected)"
          fi

      - name: Live two-process CAN self-interop (two real rust-CAN processes on real vcan0)
        if: steps.vcan.outputs.available == 'true'
        run: cargo test --release --locked --test can_two_process_interop -- --ignored --test-threads=1

      - name: Live third-party interop against can-utils (cangen/candump)
        if: steps.vcan.outputs.available == 'true' && steps.canutils.outputs.available == 'true'
        run: cargo test --release --locked --features can-utils-interop --test can_thirdparty_interop -- --ignored --test-threads=1

  # ── DCO sign-off check ─────────────────────────────────────────────────────
  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DCO sign-off on all PR commits
        run: |
          git log --format="%H" ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | while read -r sha; do
            body=$(git log -1 --format="%B" "$sha")
            if ! echo "$body" | grep -qE "^Signed-off-by: .+ <.+@.+>"; then
              echo "FAIL: commit $sha is missing a Signed-off-by line"
              exit 1
            fi
          done
          echo "DCO check passed"

  # ── Cross-compile ──────────────────────────────────────────────────────────
  cross-compile:
    name: cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: cross build --release --bin rust-can --target ${{ matrix.target }} --locked
