[package]
name = "rust-can"
version = "0.5.0"
edition = "2021"
description = "rust-CAN: Rust library for CAN bus — virtual bus, SocketCAN, DBC parser, ISO-TP, J1939, CAN FD, and safety E2E protection."
license = "MPL-2.0"
repository = "https://github.com/SoundMatt/rust-CAN"
homepage = "https://github.com/SoundMatt/rust-CAN"
keywords = ["can", "canbus", "automotive", "embedded", "relay"]
categories = ["embedded", "network-programming", "asynchronous"]
rust-version = "1.75"

[lib]
name = "rust_can"
path = "src/lib.rs"

[[bin]]
name = "rust-can"
path = "src/bin/main.rs"

# Test/dev support tool for the "live two-process test harness" and
# "third-party can-utils cross-validation" interop deliverables (see
# ROADMAP.md's "Interop testing" section) — a standalone SocketCAN
# sender/receiver process driven by the real, production
# `rust_can::socketcan::SocketCanBus`. Not part of the crate's public
# library API. See src/bin/can_interop_peer.rs's module docs.
[[bin]]
name = "can-interop-peer"
path = "src/bin/can_interop_peer.rs"

[features]
## Enables `HmacSha256Auth` — a concrete `MessageAuthenticator` using HMAC-SHA256.
## Required for ISO/SAE 21434 CAL-3 security-level integrity (REQ-SEC-006).
hmac-auth = ["dep:hmac", "dep:sha2"]

## Gates `tests/can_thirdparty_interop.rs` — CAN wire-compatibility tests
## against live, independent `can-utils` (`cangen`/`candump`) processes on
## a real kernel `vcan0` interface (ROADMAP.md "Interop testing", deliverable
## 2 of 2: a third-party, non-rust-CAN oracle beyond the two-process
## self-interop deliverable). Requires can-utils installed and a real vcan0
## interface; see the module doc comment at the top of
## tests/can_thirdparty_interop.rs for how to run it.
can-utils-interop = []

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
crc = "3"
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
